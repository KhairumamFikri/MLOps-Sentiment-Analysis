version: "3.9"

services:

  postgres:

    image: postgres:16

    container_name: postgres

    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - mlops-network


  minio:

    image: minio/minio

    container_name: minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    networks:
      - mlops-network


  mlflow:

    image: ghcr.io/mlflow/mlflow:v3.1.0

    container_name: mlflow

    depends_on:
      - postgres
      - minio

    ports:
      - "5000:5000"

    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow.db
      --host 0.0.0.0
      --port 5000

    volumes:
      - mlflow_data:/mlflow

    networks:
      - mlops-network


volumes:

  postgres_data:
  minio_data:
  mlflow_data:


networks:

  mlops-network:
    driver: bridge