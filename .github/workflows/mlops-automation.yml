name: MLOps Automation Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:

    name: Run Unit Tests

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docker.txt

      - name: Run Pytest
        run: |
          pytest

  train:

    name: Train and Validate Model

    needs: test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docker.txt

      - name: Verify Dataset
        run: |
          ls -lh data/processed

      - name: Train Model
        run: |
          python src/training/train_sentence_transformer.py

      - name: Validate Model
        run: |
          python src/training/validate_model.py

      - name: Upload Metrics Artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-metrics
          path: metrics.json

      - name: Registry Qualification
        run: |
          echo "Model passed validation threshold."
          echo "Model is qualified for MLflow Staging Registry."